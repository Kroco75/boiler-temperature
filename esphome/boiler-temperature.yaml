substitutions:
  kotel_podacha_adr: "0x6601203815d2af28"
  kotel_obratka_adr: "0x993c01d075c31328"
  boiler_adr: "0xdf3c01d075c89728"
  pogoda_adr: "0x113c01d607e36a28"

esphome:
  name: boiler-temperature
  friendly_name: Boiler Temperature
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 60%
          transition_length: 1s

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: VERBOSE

api:
  encryption:
    key: !secret boiler_api_encryption_key

web_server:
  port: 80

ota:
  - platform: esphome
    password: !secret boiler_ota_password

packages:
  wifi: !include boiler-temperature/packages/wifi.yaml
  sensors: !include boiler-temperature/packages/sensors.yaml
  display: !include boiler-temperature/packages/display.yaml
  diagnostics: !include boiler-temperature/packages/diagnostics.yaml
  globals: !include boiler-temperature/common/globals.yaml
  fonts: !include boiler-temperature/common/fonts.yaml

